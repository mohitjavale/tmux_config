# Mouse: click panes, resize, scroll
set -g mouse on
 
# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
 
# More scrollback
set -g history-limit 50000
 
# Copy to your laptop's clipboard over SSH
set -g set-clipboard on
 
# Vim-style copy mode: v to select, y to copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
 
# Better colors, no Esc delay
set -g default-terminal "screen-256color"
set -sg escape-time 10

# Status bar: blends with terminal background
set -g status-style "bg=default,fg=colour244"
set -g status-left ""
set -g status-right ""

# Windows: inactive dim, active highlighted
set -g window-status-format " #I "
set -g window-status-current-format " #I "
set -g window-status-current-style "fg=colour232,bg=colour110,bold"

